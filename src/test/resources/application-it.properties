server.port=8001

spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

spring.jpa.mapping-resources=META-INF/orm-postgresql.xml
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

spring.datasource.url=jdbc:h2:mem:test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.application.name=dictionary

de.trinimon.dictionary.cache.enabled=false
